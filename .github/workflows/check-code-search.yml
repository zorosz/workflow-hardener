name: Check code search access

on:
  push:
    branches: [test/code-search-token]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Search an external public repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '## Code search access\n\n' >> "$GITHUB_STEP_SUMMARY"
          if ! status=$(curl --silent --show-error --max-time 15 --max-filesize 1048576 \
            --proto '=https' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --get --data-urlencode 'q=addClass repo:jquery/jquery in:file' \
            --data-urlencode 'per_page=1' \
            --output response.json --write-out '%{http_code}' \
            https://api.github.com/search/code); then
            printf 'Request failed or exceeded its time/size limit; access remains unverified.\n' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Code-search request failed; access remains unverified.'
            exit 1
          fi
          printf 'HTTP status: %s\n\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 200 ]; then
            printf 'The API did not return search results. Check authentication, permissions, or rate limits.\n' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Code search returned HTTP $status; access remains unverified."
            exit 1
          fi
          if ! jq -e '.incomplete_results == false and .total_count > 0 and any(.items[]; .repository.full_name == "jquery/jquery" and .repository.private == false)' response.json > /dev/null; then
            printf 'No complete, positive external-repository result was confirmed; the result is inconclusive.\n' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Search response did not confirm a public jquery/jquery match.'
            exit 1
          fi
          printf 'Confirmed: the built-in job token returned a code-search match from public repository `jquery/jquery` with `permissions: {}`.\n' >> "$GITHUB_STEP_SUMMARY"
          echo 'Confirmed external public code-search access with the built-in job token.'
